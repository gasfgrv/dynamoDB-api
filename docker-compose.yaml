services:
  localstack:
    container_name: localstack_employee
    image: localstack/localstack:4.12.0
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
      DEFAULT_REGION: us-east-1
      DEBUG: 1
    volumes:
      - "./localstack_data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"